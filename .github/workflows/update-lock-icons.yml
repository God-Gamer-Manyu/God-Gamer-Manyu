name: Update lock icons

# Removes the 🔒 marker from README rows once their repositories become public.
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository visibility and update README
        run: python .github/scripts/update_locks.py

      - name: Commit changes
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: remove lock icon from repositories that are now public"
            git push
          fi
